<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Formulario</h2>

    <form action="" method="post">
        <ul>
            <li>
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="user_nombre">
            </li>
            <li>
                <label for="apellido">Apellido: </label>
                <input type="text" id="apellido" name="user_apellido">
            </li>
            <li>
                <label for="edad">Edad: </label>
                <input type="number" id="edad" name="user_edad">
            </li>
            <li>
                <label for="mail">E-mail: </label>
                <input placeholder="usuario@gmail.com" type="email" id="mail" name="user_email">
            </li>
            <li>
                <label for="telefono">Teléfono: </label>
                <input placeholder="012345678" type="tel" id="telef" name="user_tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" maxlength="9">
            </li>
            <li class="myf">
                <input type="radio" name="sexo" id="f" />
                <label for="femenino">Femenino</label>
              
                <input type="radio" name="sexo" id="m" />
                <label for="masculino">Masculino</label>
            </li>
            <li class="button">
                <button type="submit">Enviar</button>
                <button type="reset">Restablecer</button>
            </li>
        </ul>
    </form>
</body>
</html>
