<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <form action="" method="post">
        <h2>Formulario</h2>
        <ul>
            <li>
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="user_nombre" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ]+"
                    title="Solo se permiten letras, incluyendo tildes y ñ" required />
            </li>
            <li>
                <label for="apellido">Apellido: </label>
                <input type="text" id="apellido" name="user_apellido" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ]+"
                    title="Solo se permiten letras, incluyendo tildes y ñ" required />
            </li>
            <li>
                <label for="edad">Edad: </label>
                <input type="number" id="edad" name="user_edad" min="1" max="100" step="1" required />
            </li>
            <li>
                <label for="mail">E-mail: </label>
                <input placeholder="usuario@gmail.com" type="email" id="mail" name="user_email" required />
            </li>
            <li>
                <label for="telefono">Teléfono: </label>
                <input placeholder="012345678" type="tel" id="telef" name="user_tel" pattern="[0-9]+" maxlength="9"
                    required />
            </li>
            <li class="myf">
                <input type="radio" name="sexo" id="f" required />
                <label for="femenino">Femenino</label>

                <input type="radio" name="sexo" id="m" required />
                <label for="masculino">Masculino</label>
            </li>
            <li class="button">
                <button type="submit">Enviar</button>
                <button type="reset">Restablecer</button>
            </li>
        </ul>
    </form>
</body>

</html>
